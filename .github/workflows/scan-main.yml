on: 
  pull_request:
    branches:
      - main

name: Aikido Scan
jobs:
  aikido-local-scan-repo:
    runs-on: ubuntu-latest
    container:
      image: aikidosecurity/local-scanner:latest
    steps: 
      - uses: actions/checkout@v4 
        with: 
          token: ${{ secrets.GITHUB_TOKEN }} 
          path: ${{ github.event.repository.name }}
          fetch-depth: 0 # Makes sure base and head commit are accessible in workflow
      - name: Run scan
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: aikido-local-scanner scan $REPOSITORY_NAME --apikey ${{ secrets.AIKIDO_API_KEY }} --repositoryname $REPOSITORY_NAME --branchname $HEAD_REF --gating-mode pr --fail-on critical --base-commit-id $BASE_SHA --head-commit-id $HEAD_SHA
